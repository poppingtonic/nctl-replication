# Tooling config for the NCTL replication artifact.  This file intentionally
# keeps packaging light: the artifact is primarily released as reproducible
# source + CUDA kernels + benchmark harnesses, not as a PyPI wheel.

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [
    "build",
    "dist",
    "mlruns",
    "scripts/sweep_results",
    "**/__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E402",
    "E741",
    "B905",
    "SIM108",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*.py" = ["E501", "F401", "B007"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["scripts/tests"]
markers = [
    "cuda: marks tests that require a working CUDA device and pre-compiled NCTL CUDA kernels",
]
filterwarnings = [
    "default",
    "ignore:The filesystem tracking backend.*:FutureWarning:mlflow",
]
addopts = "-q --tb=short"

[tool.coverage.run]
branch = true
source = ["scripts/nctl_bench", "scripts"]
omit = [
    "scripts/tests/*",
    "scripts/download_mnist.py",
    "scripts/sweep_split_mnist.py",
    "scripts/run_split_mnist.py",
    "scripts/inspect_pool_provenance.py",
    "scripts/conftest.py",
    "**/__init__.py",
]
parallel = false
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "def __repr__",
    "except ImportError",
    "raise RuntimeError\\(.*Pre-compiled kernel not found",
]
fail_under = 60

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
